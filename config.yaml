# Wisemonkey Configuration

# Main model
model:
  # Provider: openai, ollama, lmstudio, anthropic, generic (OpenAI-compatible)
  provider: generic
  # Model name
  name: qwen/qwen3.6-35b-a3b
  # URL of the OpenAI endpoint
  base_url: http://127.0.0.1:1234/v1
  # Usual endpoints, offered as a picker by /model (and /url). Each entry is a
  # base_url plus, optionally, a name for the list, the provider (skips the
  # provider question) and the env var holding that endpoint's key, so
  # switching back and forth is one selection instead of four answers.
  # "Enter a new URL..." is always offered at the bottom, and a bare URL string
  # is accepted as a shorthand for an entry with no extras.
  # endpoints:
  #   - name: Local (LM Studio)
  #     base_url: http://127.0.0.1:1234/v1
  #     provider: lmstudio
  #   - name: OpenRouter
  #     base_url: https://openrouter.ai/api/v1
  #     provider: generic
  #     api_key_env: OPENROUTER_API_KEY
  #   - https://api.openai.com/v1
  # Temperature setting for inference
  temperature: 0.8
  # Name of the environment variable holding this endpoint's API key. Set it
  # when you use several routers/endpoints and want to keep their keys side by
  # side, e.g. OPENROUTER_API_KEY or OPENCODE_API_KEY. It is a variable NAME,
  # never the key itself, so config.yaml stays safe to share.
  # Left unset, the key is resolved from the environment in this order:
  #   WM_API_KEY_<PROVIDER>  (e.g. WM_API_KEY_GENERIC, WM_API_KEY_ANTHROPIC)
  #   the provider's conventional var (OPENAI_API_KEY / ANTHROPIC_API_KEY)
  #   WM_API_KEY  (generic fallback, tried last)
  # api_key_env: OPENROUTER_API_KEY
  # Token prices, per million tokens, in your currency. Optional: when set,
  # the per-turn cost is shown in the status line. Leave unset to hide cost
  # (a made-up price would be worse than none).
  # pricing:
  #   input: 3.0
  #   output: 15.0
  # Configure model reasoning
  thinking:
    # none, minimal, low, medium, high, xhigh, max
    effort: low
    # Display the model internal thinking
    display: False

# Embedding model
embedding:
  # Name
  name: qwen/qwen3-embedding-0.6b-gguf
  # URL of the OpenAI endpoint
  base_url: http://127.0.0.1:1234/v1

# Agent configuration
agent:
  max_turns: 50
  # Rolling chat memory window in turns (exchanges). If > 0, only the last
  # n exchanges (user message + everything after it until the next user
  # message) are kept; older ones are destructively removed. 0 = disabled
  # (history is only bounded by max_chat_history tokens).
  memory_rolling_window_turns: 10
  # Hard cap on tool executions per turn. 0 = unlimited.
  max_tool_calls: 0
  # A successful tool that takes at least this many seconds prints a
  # "finished in Xs" line; faster ones stay silent, since the "Activating
  # tool" line above already said it ran. Errors are always reported.
  # 0 = always print, a large value = never print.
  tool_slow_threshold: 1.0
  system_prompt: You are a helpful assistant, expert in many domains of science and engineering. Respond concisely and clearly. No fluff. Ask for clarification if needed. Do not invent. On first interaction, analyze the user's message for their name, role, interests, and preferences. Record them with `set_user_profile`.
    Use the `get_session_info` tool to check the session name and working directory. Never use tools with directories other than the session working directory unless the user requests it specifically. Record them with set_user_profile.
    **Memory policy:** You have access to persistent notes via the `get_memory` tool. These notes survive chat resets and contain important information about the user and past interactions.
      - **Always check notes** if the user asks about their preferences, past reminders, or specific facts they mentioned previously.
      - **Check notes** at the start of a session to recall any active reminders (e.g., "remember to check...").
      - Use `save_note` to store important new information the user wants you to remember long-term.
  # Display formatted output at the end of generation
  markdown: false
  # Show the big ASCII monkey banner at startup (default: off, a compact
  # one-line header is shown instead)
  banner: false
  # Render streamed output as markdown in real time (overrides the
  # end-of-turn markdown panel when active)
  markdown_stream: true
  # Length of chat history kept for context, in tokens
  max_chat_history: 80000
  # Include full tool call/result content in the chat history injected into
  # the system prompt. When false, tool results are truncated to
  # chat_history_tool_result_max_chars.
  chat_history_full_tool_results: false
  # Maximum characters kept per tool result in the formatted chat history
  chat_history_tool_result_max_chars: 200
  # @-references: writing @path/to/file in a prompt inlines the file content
  # into the message sent to the model. Files larger than this many chars
  # inject only a stub (the model can read them with read_file). Directories
  # inject a shallow listing. Set to 0 to disable the feature.
  at_file_max_chars: 8000
  # Soul file: identity/persona file loaded into the system prompt before the
  # workspace context files. The workspace soul is discovered by walking up
  # from the working directory; the global soul lives in the wisemonkey config
  # directory (~/.config/wisemonkey/). Set to an empty string to disable.
  soul_file: SOUL.md
  global_soul_file: SOUL.md
  # Skills: set to false to disable skill loading entirely (no skills
  # directories are created or scanned, and no skills enter the prompt)
  skills: true
  # Context files to load into the system prompt (relative to workspace root)
  context_files:
    - AGENTS.md
  # Mid-turn steering: while the model is generating, the bottom four terminal
  # rows are pinned as a sticky footer (DECSTBM scroll region) showing the
  # status line, a spinner, and key hints. Keystrokes typed there are captured
  # in cbreak mode; Enter queues the line and it is delivered to the model at
  # the next tool-call seam (mid-turn), falling back to running as the next
  # prompt if the turn ends first. Ctrl+C cancels the running turn as usual.
  # No-op when stdout or stdin is not a terminal.
  steer_midturn: true
  # Append every byte written to the sticky footer to
  # $XDG_STATE_HOME/wisemonkey/footer.log, for diagnosing terminal
  # rendering problems. Off by default.
  footer_debug_bytes: false
  # Enable vi mode input
  vi_mode: false
  # External tool hooks, compatible with the Claude Code / Codex hook protocol
  # (and therefore with `dcg`, the destructive command guard: point `command`
  # at the installed dcg binary and it works unchanged). Hooks run around every
  # tool call, in both REPL and daemon mode, and cover MCP tools too.
  #
  # A `pre_tool_use` hook may answer `deny`, `ask` or `allow` on stdout as
  # JSON -- {"hookSpecificOutput": {"permissionDecision": "deny",
  # "permissionDecisionReason": "..."}} -- or block with exit code 2 and the
  # reason on stderr. Silent stdout means "no opinion" and the call proceeds.
  #
  # `matcher` is a regular expression over the *wisemonkey* tool names
  # (run_command, spawn, read_file, ...); empty or "*" matches every tool.
  # Note that shell tools are presented to a hook under the Claude name
  # ("Bash") with the command in tool_input.command, which is what a stock
  # dcg matches on.
  #
  # A hook that cannot be started fails open with a warning; one that hangs
  # past `timeout` (seconds) or prints unparseable output fails closed, so a
  # guard that cannot answer does not clear the call. Set `fail_open: true`
  # on a handler to invert that.
  #
  # `honor_unsafe: true` makes a handler skip when `agent.unsafe` is set --
  # i.e. that hook respects unsafe mode. The default (false) is that hooks
  # always run, so `agent.unsafe` never silently disables a guard that did not
  # ask to be switched off.
  #
  # hooks:
  #   pre_tool_use:
  #     - matcher: "run_command|spawn"
  #       hooks:
  #         - type: command
  #           command: /usr/local/bin/dcg   # use an absolute path
  #           timeout: 5
  #   post_tool_use: []
  # Unsafe mode: when true, no user confirmation is requested -- for dangerous
  # commands, for commands that touch paths outside the session directory, and
  # for network tools (fetch_url, web_search). Intended for unattended runs.
  # It does NOT disable hooks unless a hook sets `honor_unsafe: true`.
  unsafe: false
